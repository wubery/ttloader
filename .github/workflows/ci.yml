# Проверки на каждый push и pull request. Тесты раньше запускались только руками,
# и сломанный модуль однажды уже проехал в main — CI ловит такое до деплоя.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Браузеры Playwright тестам не нужны — ставится только пакет
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линтер
        run: ruff check .
      - name: Тесты
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b входит в build: ошибки типов роняют сборку
      - run: npm run build
