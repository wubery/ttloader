# Линтер бэкенда. Набор правил намеренно узкий: ловит то, что ломает работу
# (необъявленные имена, неиспользуемые импорты, переопределения, синтаксис,
# потерянные исключения), а не стиль — стиль в проекте уже устоялся.
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[lint]
select = [
  "E9",    # синтаксические ошибки
  "F",     # pyflakes: неопределённые имена, лишние импорты, переопределения
  "B006",  # изменяемый аргумент по умолчанию
  "B904",  # raise внутри except без from — теряется причина
]
ignore = [
  "F401",  # «неиспользуемый» импорт: часть импортов нужна ради регистрации моделей
]

[lint.per-file-ignores]
"tests/*" = ["F811"]   # фикстуры pytest выглядят как переопределения
