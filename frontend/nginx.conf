server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Авторизация теперь на уровне приложения (страница входа + сессия/Telegram),
    # см. backend/app/routers/auth.py. Basic Auth больше не используется.

    # Размер заливаемого видео не ограничиваем: 0 отключает проверку целиком.
    # Раньше стоял 1024m, и на длинных роликах заливка обрывалась 413-й ошибкой.
    client_max_body_size 0;
    # Медленный канал не должен ронять большую заливку: таймауты считаются между
    # чтениями, но на мобильном интернете 60с по умолчанию не хватало.
    client_body_timeout 600s;

    # Отдаём SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API и файлы на бэкенд (пути сохраняем как есть, с /api)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 0;
        client_body_timeout 600s;
        # Отдаём тело запроса бэкенду потоком, а не копим целиком на диске nginx:
        # для файла в несколько гигабайт это лишняя запись и долгое ожидание.
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }
}
